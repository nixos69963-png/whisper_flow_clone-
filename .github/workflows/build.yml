

name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install JavaScript dependencies
        shell: pwsh
        run: npm ci

      - name: Test TypeScript speech pipeline
        shell: pwsh
        run: npm run engine:test

      - name: Download offline base.en model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .model | Out-Null
          $base = "https://huggingface.co/Systran/faster-whisper-base.en/resolve/main"
          @("config.json", "model.bin", "tokenizer.json", "vocabulary.txt") | ForEach-Object {
            Invoke-WebRequest -Uri "$base/$_" -OutFile ".model/$_"
          }

      - name: Build TypeScript engine
        shell: pwsh
        run: npm run engine:build

      - name: Stage bundled Windows engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .engine-stage/app | Out-Null
          New-Item -ItemType Directory -Force -Path .engine-stage/resources/model | Out-Null
          New-Item -ItemType Directory -Force -Path .engine-stage/node | Out-Null
          Copy-Item engine-dist/* .engine-stage/app/ -Recurse -Force
          Copy-Item node_modules .engine-stage/node_modules -Recurse -Force
          Copy-Item .model/* .engine-stage/resources/model/ -Force
          Copy-Item (Get-Command node).Source .engine-stage/node/node.exe -Force

      - name: Generate application icons
        shell: pwsh
        run: npx tauri icon app-icon.png

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseDraft: true

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: whisper-flow-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

