name: Build Whisper Flow (Windows)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install MSVC build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      # IMPORTANT: bundle.resources paths are relative to src-tauri/tauri.conf.json.
      # The earlier workflow created .engine-stage at the repository root, which
      # is why Tauri still reported: "resource path .engine-stage doesn't exist".
      - name: Prepare configured Tauri resource directory
        shell: pwsh
        run: |
          $stagePath = Join-Path $env:GITHUB_WORKSPACE "src-tauri/.engine-stage"
          New-Item -ItemType Directory -Force -Path $stagePath | Out-Null
          Set-Content -Path (Join-Path $stagePath "README.txt") -Encoding utf8 -Value "Placeholder only: faster-whisper-ts 1.2.1 in this repository ships Linux .so libraries and the engine code explicitly rejects non-Linux platforms. This Windows package will not provide working transcription until the engine is ported or replaced."
          if (-not (Test-Path (Join-Path $stagePath "README.txt"))) {
            throw "Failed to prepare Tauri resource directory at $stagePath"
          }
          Write-Host "Prepared Tauri resource directory: $stagePath"
          Get-ChildItem $stagePath -Force

      - name: Confirm unsupported native engine is not mistaken for Windows support
        shell: pwsh
        run: |
          $libPath = "node_modules/faster-whisper-ts/whisper_bridge/lib"
          if (Test-Path $libPath) {
            $names = (Get-ChildItem $libPath -File).Name
            $names | ForEach-Object { Write-Host $_ }
            if ($names -match '\.so(\.|$)') {
              Write-Warning "Linux shared libraries (.so) are present; these are not Windows DLLs."
            }
          }

      - name: Build Windows installers
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: whisper-flow-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
