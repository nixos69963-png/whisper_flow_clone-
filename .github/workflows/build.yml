name: Build Whisper Flow (Windows)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install MSVC build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      # The repository has app-icon.png at its root, but no src-tauri/icons/icon.ico.
      # Generate Tauri's platform icon set before tauri-build looks for icon.ico.
      - name: Generate Tauri app icons
        shell: pwsh
        run: |
          if (-not (Test-Path "app-icon.png")) {
            throw "Root app-icon.png was not found. Add a square PNG icon at the repository root."
          }
          npx tauri icon "./app-icon.png" --output "./src-tauri/icons"
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri icon generation failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            throw "Tauri did not generate src-tauri/icons/icon.ico"
          }
          Get-ChildItem "src-tauri/icons" -Force

      - name: Build frontend
        run: npm run build

      # bundle.resources paths are resolved relative to src-tauri/tauri.conf.json.
      - name: Prepare configured Tauri resource directory
        shell: pwsh
        run: |
          $stagePath = Join-Path $env:GITHUB_WORKSPACE "src-tauri/.engine-stage"
          New-Item -ItemType Directory -Force -Path $stagePath | Out-Null
          Set-Content `
            -Path (Join-Path $stagePath "README.txt") `
            -Encoding utf8 `
            -Value "Placeholder only: the current faster-whisper-ts package contains Linux .so libraries and the engine rejects non-Linux platforms. This Windows package will not provide working transcription until the engine is ported or replaced."
          if (-not (Test-Path (Join-Path $stagePath "README.txt"))) {
            throw "Failed to prepare Tauri resource directory at $stagePath"
          }

      - name: Check current native engine platform
        shell: pwsh
        run: |
          $libPath = "node_modules/faster-whisper-ts/whisper_bridge/lib"
          if (Test-Path $libPath) {
            $names = (Get-ChildItem $libPath -File).Name
            $names | ForEach-Object { Write-Host $_ }
            if ($names -match '\.so(\.|$)') {
              Write-Warning "Linux shared libraries (.so) are present; these are not Windows DLLs."
            }
          }

      - name: Build Windows installers
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: whisper-flow-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
