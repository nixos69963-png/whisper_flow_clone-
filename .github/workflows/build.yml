name: Build Whisper Flow (Windows)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Windows build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install JavaScript dependencies without unsupported native install script
        shell: pwsh
        run: |
          npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      # faster-whisper-ts@1.2.1's native CTranslate2 build does not provide
      # the required Windows library. Do not run engine:build/test here and
      # mistake a successful installer build for a working Windows engine.
      - name: Verify Windows native engine dependency
        shell: pwsh
        run: |
          $libPath = "node_modules/faster-whisper-ts/whisper_bridge/lib"
          if (Test-Path $libPath) {
            Write-Host "Native library directory exists: $libPath"
            Get-ChildItem $libPath -Force
          } else {
            Write-Warning "The faster-whisper-ts Windows native library is absent."
            Write-Warning "The installer can be packaged, but transcription will not work until the engine is ported/replaced for Windows."
          }

      - name: Build Tauri Windows installer
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: whisper-flow-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
