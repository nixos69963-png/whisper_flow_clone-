name: Build Whisper Flow (Windows)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install MSVC build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      # tauri.conf.json maps .engine-stage/ as a resource. Create the directory
      # so the Windows packaging step can run. The current whisper engine uses
      # Linux-only native libraries and Linux commands, so this placeholder
      # does NOT provide working Windows transcription.
      - name: Prepare engine resource directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".engine-stage" | Out-Null
          @"
          Windows engine placeholder.
          The current faster-whisper-ts engine depends on Linux-only native libraries.
          Replace this placeholder with a Windows-compatible engine before shipping
          a functional Windows transcription application.
          "@ | Set-Content -Encoding UTF8 ".engine-stage/README.txt"

      - name: Verify native engine limitation
        shell: pwsh
        run: |
          $libPath = "node_modules/faster-whisper-ts/whisper_bridge/lib"
          if (Test-Path $libPath) {
            $nativeFiles = Get-ChildItem $libPath -File
            Write-Host "Native files found:"
            $nativeFiles | ForEach-Object { Write-Host $_.Name }
            if ($nativeFiles.Name -match '\.so(\.|$)') {
              Write-Warning "Linux .so libraries were found; they cannot be used as Windows DLLs."
            }
          } else {
            Write-Warning "The faster-whisper-ts native library directory is missing."
          }

      - name: Build Windows installers
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: whisper-flow-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
